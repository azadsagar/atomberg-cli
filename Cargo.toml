[package]
name = "atomberg-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "atomberg"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.101"
chrono = {version = "0.4.43", features = ["serde"]}
clap = {version = "4.5.57", features = ["derive"]}
dirs = "6.0.0"
hex = "0.4.3"
indexmap = {version= "2.13.0", features=["serde"]}
serde = { version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
tokio = {version = "1.49.0", features = ["full"]}
toml = "1.0.1"
